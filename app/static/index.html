<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agrégateur IA</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #8b8f9a;
    --accent: #4f7cff;
    --user-bubble: #2a3550;
    --bot-bubble: #1f232c;
    --green: #2d6a4f;
    --green-text: #74c69d;
    --yellow: #3d3000;
    --yellow-text: #ffd166;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .status { font-size: 12px; color: var(--muted); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-right-radius: 3px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border-bottom-left-radius: 3px;
  }
  .msg.error {
    align-self: flex-start;
    background: #402226;
    color: #ff9b9b;
  }
  .meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
  }
  .msg.user .meta { text-align: right; }

  /* ── Panel d'analyse ────────────────────────────────────────────── */
  #analyze-panel {
    border-top: 1px solid var(--border);
    background: var(--panel);
    max-height: 420px;
    overflow-y: auto;
    transition: max-height 0.2s ease;
  }
  #analyze-panel.hidden {
    display: none;
  }
  .analyze-inner {
    max-width: 800px;
    margin: 0 auto;
    padding: 14px 20px;
  }
  .analyze-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .theme-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--accent);
    color: white;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .analyze-meta-txt {
    font-size: 11px;
    color: var(--muted);
    flex: 1;
  }
  .close-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 0 4px;
    height: auto;
    line-height: 1;
    border-radius: 4px;
  }
  .close-btn:hover { color: var(--text); background: var(--border); }

  .diff-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  @media (max-width: 600px) {
    .diff-columns { grid-template-columns: 1fr; }
  }
  .diff-col-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .diff-text {
    font-family: "Menlo", "Consolas", monospace;
    font-size: 12.5px;
    line-height: 1.6;
    padding: 10px 12px;
    border-radius: 8px;
    white-space: pre-wrap;
    word-wrap: break-word;
    min-height: 60px;
  }
  .diff-text.original {
    background: #1a1d24;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .diff-text.optimized {
    background: #0d2318;
    border: 1px solid var(--green);
    color: #c8f0d8;
  }

  .changes-list {
    margin: 0 0 10px 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .changes-list li {
    font-size: 12.5px;
    color: var(--yellow-text);
    background: var(--yellow);
    padding: 5px 10px;
    border-radius: 6px;
    border-left: 3px solid var(--yellow-text);
  }
  .changes-list li::before {
    content: "→ ";
    opacity: 0.7;
  }
  .analyze-explanation {
    font-size: 12.5px;
    color: var(--muted);
    font-style: italic;
    margin-bottom: 12px;
    padding: 8px 12px;
    border-left: 2px solid var(--border);
  }
  .analyze-actions {
    display: flex;
    gap: 8px;
  }
  .btn-secondary {
    background: #2a2e38;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 16px;
    height: 36px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
  }
  .btn-secondary:hover { background: #343843; }
  .btn-primary-sm {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 16px;
    height: 36px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-primary-sm:hover { background: #3d6aee; }

  /* ── Composer ─────────────────────────────────────────────────────── */
  #composer {
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    background: var(--panel);
  }
  #composer form {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #prompt {
    flex: 1;
    resize: none;
    background: #1c1f27;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    max-height: 160px;
    min-height: 44px;
  }
  #prompt:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    height: 44px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #analyze-btn {
    background: #2a2e38;
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 13px;
    padding: 0 14px;
    white-space: nowrap;
  }
  #analyze-btn:hover:not(:disabled) { background: #343843; }
  #analyze-btn.loading { color: var(--muted); }

  .typing { color: var(--muted); font-style: italic; }
  .options {
    max-width: 800px;
    margin: 0 auto 8px;
    display: flex;
    gap: 14px;
    font-size: 12px;
    color: var(--muted);
    align-items: center;
    flex-wrap: wrap;
  }
  .options label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  select {
    background: #1c1f27;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 6px;
    font-size: 12px;
  }
  select:disabled { opacity: 0.4; }

  /* ── Export des réponses ─────────────────────────────────────────── */
  .export-row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .export-btn {
    background: #232730;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 10px;
    height: 26px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 500;
    line-height: 1;
  }
  .export-btn:hover:not(:disabled) { background: #2f3542; }
  .export-btn:disabled { opacity: 0.5; cursor: default; }

  /* ── Import de fichiers ──────────────────────────────────────────── */
  #attach-btn {
    background: #2a2e38;
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 16px;
    padding: 0 14px;
    height: 44px;
    flex-shrink: 0;
  }
  #attach-btn:hover:not(:disabled) { background: #343843; }
  #attach-btn:disabled { opacity: 0.5; cursor: default; }
  .attachment-zone {
    max-width: 800px;
    margin: 0 auto 8px;
  }
  .attachment-zone.hidden { display: none; }
  .attachment-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #1c2333;
    border: 1px solid var(--accent);
    color: var(--text);
    font-size: 12px;
    padding: 5px 8px 5px 12px;
    border-radius: 20px;
  }
  .attachment-chip button {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 6px;
    height: auto;
    border-radius: 50%;
  }
  .attachment-chip button:hover { color: var(--text); background: var(--border); }

  /* ── Modale « Pousser sur GitHub » ───────────────────────────────── */
  .gh-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .gh-overlay.hidden { display: none; }
  .gh-modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 460px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 20px 22px;
  }
  .gh-modal h2 {
    margin: 0 0 4px;
    font-size: 17px;
  }
  .gh-modal .gh-sub {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 16px;
  }
  .gh-field { margin-bottom: 12px; }
  .gh-field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .gh-field input,
  .gh-field select {
    width: 100%;
    background: #232730;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  .gh-field input:focus,
  .gh-field select:focus { outline: none; border-color: var(--accent); }
  .gh-checks { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 14px; }
  .gh-checks label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
  }
  .gh-checks input { width: auto; }
  .gh-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .gh-actions button {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
  }
  .gh-cancel { background: #232730; color: var(--text); }
  .gh-cancel:hover { background: #2f3542; }
  .gh-submit { background: var(--accent); color: #fff; border-color: var(--accent); }
  .gh-submit:hover:not(:disabled) { background: #3d67e0; }
  .gh-submit:disabled { opacity: 0.5; cursor: default; }
  .gh-result {
    font-size: 12px;
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 6px;
    white-space: pre-wrap;
    display: none;
  }
  .gh-result.ok { display: block; background: var(--green); color: #fff; }
  .gh-result.err { display: block; background: #5a1f1f; color: #ffd9d9; }
  .gh-result.info { display: block; background: #1c2333; color: var(--text); }
  .gh-dirty-note { color: var(--yellow-text); font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>Agrégateur IA</h1>
  <span class="status" id="status-line">chargement du statut…</span>
</header>

<div id="messages"></div>

<!-- Panel d'analyse prompt — caché par défaut -->
<div id="analyze-panel" class="hidden">
  <div class="analyze-inner">
    <div class="analyze-header">
      <span id="analyze-theme-badge" class="theme-badge"></span>
      <span id="analyze-meta-txt" class="analyze-meta-txt"></span>
      <button class="close-btn" id="analyze-close" title="Fermer">✕</button>
    </div>
    <div class="diff-columns">
      <div>
        <div class="diff-col-label">Prompt original</div>
        <div id="diff-original" class="diff-text original"></div>
      </div>
      <div>
        <div class="diff-col-label">✨ Prompt optimisé</div>
        <div id="diff-optimized" class="diff-text optimized"></div>
      </div>
    </div>
    <ul id="analyze-changes" class="changes-list"></ul>
    <div id="analyze-explanation" class="analyze-explanation"></div>
    <div class="analyze-actions">
      <button class="btn-secondary" id="use-original-btn">Envoyer l'original</button>
      <button class="btn-primary-sm" id="use-optimized-btn">Envoyer l'optimisé ✨</button>
    </div>
  </div>
</div>

<div id="composer">
  <div class="options">
    <label><input type="checkbox" id="team-toggle"> Mode équipe (Claude planifie et relit, un modèle gratuit exécute)</label>
    <label><input type="checkbox" id="premium-toggle"> Mode premium (payant, Claude/GPT)</label>
    <select id="premium-provider">
      <option value="anthropic">Claude</option>
      <option value="openai">GPT</option>
    </select>
    <label><input type="checkbox" id="model-toggle"> Choisir le modèle gratuit</label>
    <select id="model-select" disabled>
      <option value="">chargement…</option>
    </select>
  </div>
  <div id="attachment-zone" class="attachment-zone hidden">
    <span id="attachment-chip" class="attachment-chip"></span>
  </div>
  <form id="chat-form">
    <input type="file" id="file-input" accept=".txt,.md,.markdown,.json,.csv,.html,.htm,.css,.js,.py,.pdf,.docx" hidden>
    <button type="button" id="attach-btn" title="Joindre un fichier (PDF, Word, texte, CSV, JSON…)">📎</button>
    <textarea id="prompt" placeholder="Écris ton message… (Entrée pour envoyer, Maj+Entrée pour une nouvelle ligne)" rows="1"></textarea>
    <button type="button" id="analyze-btn" title="Analyser et optimiser le prompt avant envoi">✨ Analyser</button>
    <button type="submit" id="send-btn">Envoyer</button>
  </form>
</div>

<!-- Modale « Pousser sur GitHub » — cachée par défaut -->
<div id="gh-overlay" class="gh-overlay hidden">
  <div class="gh-modal">
    <h2>📤 Pousser sur GitHub</h2>
    <div class="gh-sub">Écrit le fichier dans le bon dossier du dépôt local, puis commit + push.</div>

    <div class="gh-field">
      <label for="gh-repo">Dépôt</label>
      <select id="gh-repo"><option value="">chargement…</option></select>
      <div id="gh-dirty-note" class="gh-dirty-note"></div>
    </div>

    <div class="gh-field">
      <label for="gh-path">Dossier de destination (vide = racine du dépôt)</label>
      <input id="gh-path" list="gh-folders" placeholder="ex : src/pages" autocomplete="off">
      <datalist id="gh-folders"></datalist>
    </div>

    <div class="gh-field">
      <label for="gh-filename">Nom du fichier</label>
      <input id="gh-filename" placeholder="ex : notes.md" autocomplete="off">
    </div>

    <div class="gh-field">
      <label for="gh-message">Message de commit</label>
      <input id="gh-message" placeholder="Ajout via l'agrégateur IA" autocomplete="off">
    </div>

    <div class="gh-checks">
      <label><input type="checkbox" id="gh-commit" checked> Créer un commit</label>
      <label><input type="checkbox" id="gh-push" checked> Pousser sur GitHub (push)</label>
      <label><input type="checkbox" id="gh-overwrite" checked> Écraser si le fichier existe déjà</label>
    </div>

    <div class="gh-actions">
      <button type="button" class="gh-cancel" id="gh-cancel">Annuler</button>
      <button type="button" class="gh-submit" id="gh-submit">Pousser</button>
    </div>

    <div id="gh-result" class="gh-result"></div>
  </div>
</div>

<script>
const messagesEl   = document.getElementById("messages");
const form         = document.getElementById("chat-form");
const promptEl     = document.getElementById("prompt");
const sendBtn      = document.getElementById("send-btn");
const teamToggle   = document.getElementById("team-toggle");
const premiumToggle = document.getElementById("premium-toggle");
const premiumProvider = document.getElementById("premium-provider");
const modelToggle  = document.getElementById("model-toggle");
const modelSelect  = document.getElementById("model-select");
const statusLine   = document.getElementById("status-line");
const fileInput      = document.getElementById("file-input");
const attachBtn       = document.getElementById("attach-btn");
const attachmentZone  = document.getElementById("attachment-zone");
const attachmentChip  = document.getElementById("attachment-chip");

// Pièce jointe en attente d'envoi : { filename, content, char_count, truncated }
let pendingAttachment = null;

// Panel d'analyse
const analyzePanel    = document.getElementById("analyze-panel");
const analyzeBtn      = document.getElementById("analyze-btn");
const analyzeClose    = document.getElementById("analyze-close");
const analyzeBadge    = document.getElementById("analyze-theme-badge");
const analyzeMetaTxt  = document.getElementById("analyze-meta-txt");
const diffOriginal    = document.getElementById("diff-original");
const diffOptimized   = document.getElementById("diff-optimized");
const analyzeChanges  = document.getElementById("analyze-changes");
const analyzeExplain  = document.getElementById("analyze-explanation");
const useOriginalBtn  = document.getElementById("use-original-btn");
const useOptimizedBtn = document.getElementById("use-optimized-btn");

// Dernier résultat d'analyse (pour les boutons Utiliser)
let lastAnalysis = null;

// ── Auth ────────────────────────────────────────────────────────────────────

function getAccessToken() {
  let token = localStorage.getItem("accessToken");
  if (!token) {
    token = window.prompt("Code d'accès :") || "";
    localStorage.setItem("accessToken", token);
  }
  return token;
}

function authHeaders(extra) {
  return Object.assign({ "X-Access-Token": getAccessToken() }, extra || {});
}

// ── Messages ────────────────────────────────────────────────────────────────

function addMessage(role, text, meta) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  if (meta) {
    const metaEl = document.createElement("div");
    metaEl.className = "meta";
    metaEl.textContent = meta;
    div.appendChild(metaEl);
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

// ── Textarea auto-resize ────────────────────────────────────────────────────

promptEl.addEventListener("input", () => {
  promptEl.style.height = "auto";
  promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + "px";
});

promptEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

// ── Options mutuellement exclusives ─────────────────────────────────────────

modelToggle.addEventListener("change", () => {
  modelSelect.disabled = !modelToggle.checked;
  if (modelToggle.checked) premiumToggle.checked = false;
});

premiumToggle.addEventListener("change", () => {
  if (premiumToggle.checked) {
    modelToggle.checked = false;
    modelSelect.disabled = true;
  }
});

// ── Panel analyse ───────────────────────────────────────────────────────────

function showAnalysisPanel(data) {
  lastAnalysis = data;

  analyzeBadge.textContent = data.theme_label;
  analyzeMetaTxt.textContent =
    `${data.source_tier === "tier1" ? "Regex" : "Groq"} · confiance ${Math.round(data.confidence * 100)}%`;

  diffOriginal.textContent  = data.original;
  diffOptimized.textContent = data.optimized;

  analyzeChanges.innerHTML = "";
  (data.changes || []).forEach(c => {
    const li = document.createElement("li");
    li.textContent = c;
    analyzeChanges.appendChild(li);
  });

  analyzeExplain.textContent = data.explanation || "";
  analyzePanel.classList.remove("hidden");

  // Scroll pour que le panel soit visible
  analyzePanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function hideAnalysisPanel() {
  analyzePanel.classList.add("hidden");
  lastAnalysis = null;
}

analyzeClose.addEventListener("click", hideAnalysisPanel);

// Analyser le prompt courant
analyzeBtn.addEventListener("click", async () => {
  const text = promptEl.value.trim();
  if (!text) return;

  analyzeBtn.disabled = true;
  analyzeBtn.textContent = "Analyse…";
  analyzeBtn.classList.add("loading");

  try {
    const resp = await fetch("/prompt/analyze", {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ prompt: text }),
    });

    if (resp.status === 401) {
      localStorage.removeItem("accessToken");
      alert("Code d'accès invalide. Recharge la page.");
      return;
    }
    if (!resp.ok) {
      const err = await resp.json();
      alert("Erreur analyse : " + (err.detail || resp.status));
      return;
    }

    const data = await resp.json();
    showAnalysisPanel(data);

  } catch (err) {
    alert("Impossible de contacter le serveur : " + err.message);
  } finally {
    analyzeBtn.disabled = false;
    analyzeBtn.textContent = "✨ Analyser";
    analyzeBtn.classList.remove("loading");
  }
});

// Envoyer l'original — remet le texte d'origine dans le textarea et envoie
useOriginalBtn.addEventListener("click", () => {
  if (!lastAnalysis) return;
  promptEl.value = lastAnalysis.original;
  promptEl.style.height = "auto";
  promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + "px";
  hideAnalysisPanel();
  form.requestSubmit();
});

// Envoyer l'optimisé — injecte le prompt amélioré et envoie
useOptimizedBtn.addEventListener("click", () => {
  if (!lastAnalysis) return;
  promptEl.value = lastAnalysis.optimized;
  promptEl.style.height = "auto";
  promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + "px";
  hideAnalysisPanel();
  form.requestSubmit();
});

// ── Export des réponses (MD / HTML / JSON / CSS en local, PDF via le serveur) ─

function slugify(text) {
  return (text || "document")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "")
    .slice(0, 50) || "document";
}

function downloadBlob(filename, mime, data) {
  const blob = new Blob([data], { type: mime + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function buildHtmlDoc(content, title) {
  const escaped = content
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return `<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>${title}</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #1a1a1a; background: #fff; }
  h1 { border-bottom: 2px solid #4f7cff; padding-bottom: 8px; }
  .footer { margin-top: 40px; font-size: 12px; color: #999; }
</style>
</head>
<body>
<h1>${title}</h1>
<div>${escaped.replace(/\n/g, "<br>")}</div>
<div class="footer">Généré par l'Agrégateur IA — Mon Bureau, le ${new Date().toLocaleString("fr-FR")}</div>
</body>
</html>`;
}

async function exportAs(ext, content, label, btnEl) {
  const filename = `${slugify(label)}-${Date.now()}.${ext}`;

  if (ext === "pdf") {
    const original = btnEl.textContent;
    btnEl.disabled = true;
    btnEl.textContent = "…";
    try {
      const resp = await fetch("/export/pdf", {
        method: "POST",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ content, title: label }),
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        alert("Erreur export PDF : " + (err.detail || resp.status));
        return;
      }
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (err) {
      alert("Impossible de contacter le serveur : " + err.message);
    } finally {
      btnEl.disabled = false;
      btnEl.textContent = original;
    }
    return;
  }

  if (ext === "md") {
    downloadBlob(filename, "text/markdown", content);
  } else if (ext === "css") {
    downloadBlob(filename, "text/css", content);
  } else if (ext === "html") {
    downloadBlob(filename, "text/html", buildHtmlDoc(content, label));
  } else if (ext === "json") {
    const payload = JSON.stringify(
      { content, label, exported_at: new Date().toISOString() }, null, 2
    );
    downloadBlob(filename, "application/json", payload);
  }
}

function addExportRow(container, content, label) {
  const row = document.createElement("div");
  row.className = "export-row";

  const buttons = [
    { ext: "md",   icon: "📝 MD",   title: "Télécharger en Markdown" },
    { ext: "html", icon: "🌐 HTML", title: "Télécharger en HTML" },
    { ext: "json", icon: "{ } JSON", title: "Télécharger en JSON" },
    { ext: "css",  icon: "🎨 CSS",  title: "Télécharger en CSS" },
    { ext: "pdf",  icon: "📕 PDF",  title: "Télécharger en PDF" },
  ];

  buttons.forEach((b) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "export-btn";
    btn.title = b.title;
    btn.textContent = b.icon;
    btn.addEventListener("click", () => exportAs(b.ext, content, label, btn));
    row.appendChild(btn);
  });

  // Pousser cette réponse dans un dépôt local GitHub Desktop.
  const ghBtn = document.createElement("button");
  ghBtn.type = "button";
  ghBtn.className = "export-btn";
  ghBtn.title = "Écrire dans un dépôt GitHub Desktop, puis commit + push";
  ghBtn.textContent = "📤 GitHub";
  ghBtn.addEventListener("click", () => openGithubModal(content, label));
  row.appendChild(ghBtn);

  container.appendChild(row);
}

// ── Pousser sur GitHub Desktop ─────────────────────────────────────────────

const ghOverlay   = document.getElementById("gh-overlay");
const ghRepoSel   = document.getElementById("gh-repo");
const ghFolders   = document.getElementById("gh-folders");
const ghPathEl    = document.getElementById("gh-path");
const ghFilename  = document.getElementById("gh-filename");
const ghMessage   = document.getElementById("gh-message");
const ghCommit    = document.getElementById("gh-commit");
const ghPush      = document.getElementById("gh-push");
const ghOverwrite = document.getElementById("gh-overwrite");
const ghCancel    = document.getElementById("gh-cancel");
const ghSubmit    = document.getElementById("gh-submit");
const ghResult    = document.getElementById("gh-result");
const ghDirtyNote = document.getElementById("gh-dirty-note");

let ghContent = "";
let ghRepos = [];        // cache de la dernière liste chargée
let ghReposLoaded = false;

// Devine une extension de fichier à partir du contenu (pour préremplir le nom).
function guessExtension(content, label) {
  const c = (content || "").trim();
  if (/^\s*[{[]/.test(c) && /[}\]]\s*$/.test(c)) return "json";
  if (/^\s*</.test(c) && /<\/(html|body|div|section)>/i.test(c)) return "html";
  if (/^#{1,6}\s|\n#{1,6}\s|\n[-*]\s|```/.test(c)) return "md";
  if (/\b(def |import |print\(|class .*:)/.test(c)) return "py";
  if (/\b(function |const |let |=>|console\.log)/.test(c)) return "js";
  if (/[.#][\w-]+\s*\{[^}]*:[^}]*\}/.test(c)) return "css";
  return "md";
}

function renderRepoOptions() {
  ghRepoSel.innerHTML = "";
  if (!ghRepos.length) {
    ghRepoSel.innerHTML = '<option value="">aucun dépôt détecté</option>';
    return;
  }
  for (const r of ghRepos) {
    const opt = document.createElement("option");
    opt.value = r.name;
    opt.textContent = r.name + (r.branch ? ` (${r.branch})` : "");
    ghRepoSel.appendChild(opt);
  }
  updateFoldersForRepo();
}

function updateFoldersForRepo() {
  const repo = ghRepos.find((r) => r.name === ghRepoSel.value);
  ghFolders.innerHTML = "";
  if (repo && repo.folders) {
    for (const f of repo.folders) {
      const opt = document.createElement("option");
      opt.value = f;
      ghFolders.appendChild(opt);
    }
  }
  ghDirtyNote.textContent = repo && repo.dirty
    ? "⚠ Ce dépôt a déjà des modifications non validées : le commit ne portera que sur ce fichier."
    : "";
}

async function loadGithubRepos(force) {
  if (ghReposLoaded && !force) return;
  try {
    const resp = await fetch("/github/repos", { headers: authHeaders() });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    ghRepos = data.repos || [];
    ghReposLoaded = true;
    renderRepoOptions();
  } catch (err) {
    ghRepoSel.innerHTML = '<option value="">erreur de chargement</option>';
  }
}

function openGithubModal(content, label) {
  ghContent = content;
  ghResult.className = "gh-result";
  ghResult.textContent = "";
  ghSubmit.disabled = false;
  ghSubmit.textContent = "Pousser";

  const ext = guessExtension(content, label);
  ghFilename.value = `${slugify(label)}.${ext}`;
  ghMessage.value = "";
  ghPathEl.value = "";

  ghOverlay.classList.remove("hidden");
  loadGithubRepos(false);
}

function closeGithubModal() {
  ghOverlay.classList.add("hidden");
}

ghCancel.addEventListener("click", closeGithubModal);
ghOverlay.addEventListener("click", (e) => {
  if (e.target === ghOverlay) closeGithubModal();
});
ghRepoSel.addEventListener("change", updateFoldersForRepo);
ghPush.addEventListener("change", () => {
  // Un push sans commit n'a pas de sens : cocher push force commit.
  if (ghPush.checked) ghCommit.checked = true;
});
ghCommit.addEventListener("change", () => {
  if (!ghCommit.checked) ghPush.checked = false;
});

ghSubmit.addEventListener("click", async () => {
  const repo = ghRepoSel.value;
  if (!repo) {
    ghResult.className = "gh-result err";
    ghResult.textContent = "Choisis un dépôt.";
    return;
  }
  if (!ghFilename.value.trim()) {
    ghResult.className = "gh-result err";
    ghResult.textContent = "Indique un nom de fichier.";
    return;
  }

  ghSubmit.disabled = true;
  ghSubmit.textContent = "…";
  ghResult.className = "gh-result info";
  ghResult.textContent = ghPush.checked ? "Écriture, commit et push en cours…" : "Écriture en cours…";

  try {
    const resp = await fetch("/github/push", {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({
        repo,
        path: ghPathEl.value.trim(),
        filename: ghFilename.value.trim(),
        content: ghContent,
        message: ghMessage.value.trim() || null,
        commit: ghCommit.checked,
        push: ghPush.checked,
        overwrite: ghOverwrite.checked,
      }),
    });
    const data = await resp.json();

    if (resp.status === 401) {
      localStorage.removeItem("accessToken");
      ghResult.className = "gh-result err";
      ghResult.textContent = "Code d'accès invalide. Recharge la page.";
      return;
    }
    if (!resp.ok) {
      ghResult.className = "gh-result err";
      ghResult.textContent = data.detail || "Erreur inconnue.";
      return;
    }

    ghResult.className = "gh-result ok";
    ghResult.textContent = "✅ " + (data.message || "Fait.");
    // La liste des dépôts a pu changer d'état (dirty) : on la rafraîchira au prochain ouvrir.
    ghReposLoaded = false;
  } catch (err) {
    ghResult.className = "gh-result err";
    ghResult.textContent = "Impossible de contacter le serveur : " + err.message;
  } finally {
    ghSubmit.disabled = false;
    ghSubmit.textContent = "Pousser";
  }
});

// ── Import de fichiers (pièce jointe) ──────────────────────────────────────

attachBtn.addEventListener("click", () => fileInput.click());

function clearAttachment() {
  pendingAttachment = null;
  attachmentZone.classList.add("hidden");
  attachmentChip.innerHTML = "";
}

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  fileInput.value = "";
  if (!file) return;

  attachBtn.disabled = true;
  const original = attachBtn.textContent;
  attachBtn.textContent = "…";

  try {
    const formData = new FormData();
    formData.append("file", file);
    const resp = await fetch("/import/extract", {
      method: "POST",
      headers: authHeaders(), // pas de Content-Type ici : le navigateur le fixe lui-même pour un envoi multipart
      body: formData,
    });
    const data = await resp.json();

    if (resp.status === 401) {
      localStorage.removeItem("accessToken");
      alert("Code d'accès invalide. Recharge la page.");
      return;
    }
    if (!resp.ok) {
      alert("Erreur import : " + (data.detail || resp.status));
      return;
    }

    pendingAttachment = data;
    attachmentChip.innerHTML = "";
    const label = document.createElement("span");
    label.textContent =
      `📎 ${data.filename} (${data.char_count.toLocaleString("fr-FR")} caractères` +
      (data.truncated ? ", tronqué" : "") + ")";
    const removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.textContent = "✕";
    removeBtn.title = "Retirer la pièce jointe";
    removeBtn.addEventListener("click", clearAttachment);
    attachmentChip.appendChild(label);
    attachmentChip.appendChild(removeBtn);
    attachmentZone.classList.remove("hidden");
  } catch (err) {
    alert("Impossible de contacter le serveur : " + err.message);
  } finally {
    attachBtn.disabled = false;
    attachBtn.textContent = original;
  }
});

// ── Submit principal ─────────────────────────────────────────────────────────

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = promptEl.value.trim();
  if (!text && !pendingAttachment) return;

  // Si un fichier est joint, son contenu est inséré automatiquement avant
  // le message tapé — l'utilisateur voit juste le chip, pas le texte brut.
  let sentPrompt = text;
  if (pendingAttachment) {
    sentPrompt =
      `[Fichier joint : ${pendingAttachment.filename}]\n<<<contenu extrait>>>\n` +
      `${pendingAttachment.content}\n<<<fin du fichier>>>\n\n${text}`.trim();
  }
  const attachedFilename = pendingAttachment ? pendingAttachment.filename : null;

  hideAnalysisPanel();
  addMessage("user", text || `📎 ${attachedFilename}`, attachedFilename && text ? `Pièce jointe : ${attachedFilename}` : null);
  clearAttachment();
  promptEl.value = "";
  promptEl.style.height = "auto";
  sendBtn.disabled = true;

  const isTeam = teamToggle.checked;
  const typingEl = addMessage(
    "bot",
    isTeam ? "L'équipe travaille (plan → exécution → relecture)… ça peut prendre 1 à 3 minutes." : "…"
  );
  typingEl.classList.add("typing");

  const body = { prompt: sentPrompt };
  if (!isTeam && premiumToggle.checked) {
    body.premium = true;
    body.premium_provider = premiumProvider.value;
  } else if (!isTeam && modelToggle.checked && modelSelect.value) {
    const [provider, modelId] = modelSelect.value.split("::");
    body.provider = provider;
    body.model_id = modelId;
  }

  try {
    const resp = await fetch(isTeam ? "/team" : "/chat", {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    typingEl.classList.remove("typing");

    if (resp.status === 401) {
      localStorage.removeItem("accessToken");
      typingEl.className = "msg error";
      typingEl.textContent = "Code d'accès invalide. Recharge la page pour le ressaisir.";
    } else if (!resp.ok) {
      typingEl.className = "msg error";
      typingEl.textContent = data.detail || "Erreur inconnue.";
    } else {
      typingEl.textContent = data.response;
      let metaText;
      if (isTeam) {
        metaText = data.steps
          .map((s) => `${s.step}: ${s.provider}${s.model ? " / " + s.model : ""}`)
          .join(" · ") + ` (${data.category})`;
      } else {
        metaText = `${data.provider} / ${data.model} (${data.category})`;
      }
      if (data.cost_usd !== null && data.cost_usd !== undefined) {
        metaText += ` — $${data.cost_usd.toFixed(4)}`;
      }
      const metaEl = document.createElement("div");
      metaEl.className = "meta";
      metaEl.textContent = metaText;
      typingEl.appendChild(metaEl);

      addExportRow(typingEl, data.response, isTeam ? "reponse-equipe" : data.category);
    }
  } catch (err) {
    typingEl.classList.remove("typing");
    typingEl.className = "msg error";
    typingEl.textContent = "Impossible de contacter le serveur : " + err.message;
  } finally {
    sendBtn.disabled = false;
    refreshStatus();
  }
});

// ── Modèles & statut ─────────────────────────────────────────────────────────

async function loadModels() {
  try {
    const resp = await fetch("/models", { headers: authHeaders() });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    modelSelect.innerHTML = "";
    for (const cat of data.categories) {
      const inCat = data.models.filter((m) => m.categories.includes(cat));
      if (!inCat.length) continue;
      const group = document.createElement("optgroup");
      group.label = cat;
      for (const m of inCat) {
        const opt = document.createElement("option");
        opt.value = `${m.provider}::${m.model_id}`;
        opt.textContent = `${m.provider} / ${m.model_id}`;
        group.appendChild(opt);
      }
      modelSelect.appendChild(group);
    }
  } catch (err) {
    modelSelect.innerHTML = '<option value="">indisponible</option>';
  }
}

async function refreshStatus() {
  try {
    const resp = await fetch("/status", { headers: authHeaders() });
    if (resp.status === 401) {
      statusLine.textContent = "code d'accès invalide";
      return;
    }
    const data = await resp.json();
    const parts = Object.entries(data.quota)
      .filter(([, q]) => q.rpd_limit > 0)
      .map(([name, q]) => {
        let s = `${name}: ${q.rpd_used}/${q.rpd_limit} req`;
        if (q.tpm_limit) s += `, ${q.tpm_used}/${q.tpm_limit} tok/min`;
        return s;
      })
      .join(" · ");
    statusLine.textContent = parts + ` · budget: $${data.budget.remaining_usd.toFixed(2)} restant`;
  } catch (err) {
    statusLine.textContent = "statut indisponible";
  }
}

loadModels();
refreshStatus();
</script>
